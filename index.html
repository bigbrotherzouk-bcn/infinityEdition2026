<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Prueba</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333333;
            margin-bottom: 0.5rem;
        }
        p {
            color: #666666;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Hola, mundo!</h1>
        <p>Esta es una página de prueba para verificar el despliegue en GitHub Pages.</p>
    </div>

</body>
</html>
